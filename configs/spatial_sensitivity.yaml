data:
  raw_path: data/raw/socat/SOCATv2025_tracks_gridded_monthly.csv
  year_start: 1990
  year_end: 2024
  latitude_max: -35.0

validation:
  temporal_test_start: 2020
  spatial_block_lon_degrees: 20
  spatial_block_lat_degrees: 10
  n_spatial_folds: 5

sampling:
  initial_fraction: 0.10
  budget: 0.20
  coverage_cells:
    longitude_degrees: 10
    latitude_degrees: 5

statistics:
  bootstrap_resamples: 10000
  confidence_level: 0.95
  bootstrap_seed: 4100
